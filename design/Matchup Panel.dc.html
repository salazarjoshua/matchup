<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;display:flex;gap:12px;align-items:flex-start;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">

  <div style="width:64px;flex:none;border-radius:16px;background:#0a0a0a;border:1px solid rgba(255,255,255,.12);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:40px;height:24px;border-radius:12px;display:grid;grid-template-columns:repeat(3,4px);grid-template-rows:repeat(2,4px);gap:4px;place-content:center;cursor:grab">
      <div style="width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.38)"></div>
      <div style="width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.38)"></div>
      <div style="width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.38)"></div>
      <div style="width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.38)"></div>
      <div style="width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.38)"></div>
      <div style="width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.38)"></div>
    </div>
    <div style="width:40px;height:40px;border-radius:12px;display:grid;place-items:center"><span style="font-size:18px;line-height:1;display:block">🥊</span></div>
    <div style="width:24px;height:1px;background:rgba(255,255,255,.16)"></div>

    <div style="{{ eyeTile }}">
      <sc-if value="{{ visible }}" hint-placeholder-val="{{ true }}">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><ellipse cx="12" cy="12" rx="9.5" ry="6"></ellipse><circle cx="12" cy="12" r="2.6" fill="#fff"></circle></svg>
      </sc-if>
      <sc-if value="{{ hidden }}" hint-placeholder-val="{{ false }}">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><ellipse cx="12" cy="12" rx="9.5" ry="6"></ellipse><circle cx="12" cy="12" r="2.6"></circle><path d="M4 20 20 4"></path></svg>
      </sc-if>
    </div>

    <div style="{{ lockTile }}">
      <sc-if value="{{ locked }}" hint-placeholder-val="{{ false }}">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5" fill="#111" stroke="none"></rect><path d="M8.2 10.5V8.2a3.8 3.8 0 0 1 7.6 0v2.3"></path></svg>
      </sc-if>
      <sc-if value="{{ unlocked }}" hint-placeholder-val="{{ true }}">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5"></rect><path d="M8.2 10.5V8.2a3.8 3.8 0 0 1 7.6 0"></path></svg>
      </sc-if>
    </div>

    <div style="{{ diffTile }}">
      <sc-if value="{{ diff }}" hint-placeholder-val="{{ false }}">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 0 0 18Z" fill="#111" stroke="none"></path></svg>
      </sc-if>
      <sc-if value="{{ noDiff }}" hint-placeholder-val="{{ true }}">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 0 0 18Z" fill="rgba(255,255,255,.5)" stroke="none"></path></svg>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{ showTip }}" hint-placeholder-val="{{ false }}">
    <div style="{{ tipStyle }}">{{ tip }}</div>
  </sc-if>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
  <div style="width:320px;flex:none;border-radius:16px;background:#fff;border:1px solid rgba(0,0,0,.08);box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden">

    <div style="display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-bottom:1px solid rgba(0,0,0,.08)">
      <span style="font-size:15px;line-height:1">🥊</span>
      <span style="font:600 12px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.01em;color:#111">Matchup</span>
      <span style="margin-left:auto;display:flex;align-items:center;gap:4px">
        <span style="{{ gearTile }}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#6b6b6b" stroke-width="2.2" stroke-linecap="round" style="display:block"><path d="M3.5 8h17M3.5 16h17"></path><circle cx="9" cy="8" r="2.4" fill="#fff"></circle><circle cx="15.5" cy="16" r="2.4" fill="#fff"></circle></svg></span>
        <span style="{{ infoTile }}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#6b6b6b" stroke-width="2" stroke-linecap="round" style="display:block"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5.5"></path><circle cx="12" cy="7.6" r="1.1" fill="#6b6b6b" stroke="none"></circle></svg></span>
      </span>
    </div>

    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;gap:12px;padding:12px">
        <div style="flex:1;aspect-ratio:1/1;border-radius:12px;background:#FF3B2F;padding:12px;display:flex;flex-direction:column;justify-content:space-between">
          <span style="font:400 26px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#fff">↑</span>
          <span style="font:700 13px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#fff">Upload</span>
        </div>
        <div style="flex:1;aspect-ratio:1/1;border-radius:12px;background:#FFC400;padding:12px;display:flex;flex-direction:column;justify-content:space-between">
          <span style="font:400 24px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#111">⌘V</span>
          <span style="font:700 13px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#111">Paste</span>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
      <div style="margin:12px 12px 0;padding:10px 12px;border-radius:12px;background:#FFECEA;display:flex;align-items:flex-start;gap:8px">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#D62D20" stroke-width="2.2" stroke-linecap="round" style="display:block;flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v6"></path><circle cx="12" cy="16.8" r="1.1" fill="#D62D20" stroke="none"></circle></svg>
        <span style="font:11px/1.4 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#8E1C13">brief.pdf isn’t supported. Use PNG, JPG, WebP or SVG.</span>
      </div>
    </sc-if>

    <sc-if value="{{ hasLayers }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px">
        <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="3">
          <div style="min-width:0;display:flex;flex-direction:column;gap:8px">
            <div style="{{ t.tile }}">
              <sc-if value="{{ t.showActions }}" hint-placeholder-val="{{ false }}">
                <span style="position:absolute;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px">
                  <span style="width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.3)"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M4 20h4L20 8l-4-4L4 16v4Z"></path><path d="M14.5 5.5 18.5 9.5"></path></svg></span>
                  <span style="width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.3)"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" style="display:block"><path d="M6 6l12 12M18 6 6 18"></path></svg></span>
                </span>
              </sc-if>
              <sc-if value="{{ t.showLock }}" hint-placeholder-val="{{ false }}">
                <span style="position:absolute;bottom:4px;right:4px;width:18px;height:18px;border-radius:6px;background:#FF8A00;display:grid;place-items:center"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5" fill="#111" stroke="none"></rect><path d="M8.2 10.5V8.2a3.8 3.8 0 0 1 7.6 0v2.3"></path></svg></span>
              </sc-if>
              <sc-if value="{{ t.showSpinner }}" hint-placeholder-val="{{ false }}">
                <span style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.72);font:10px ui-monospace,Menlo,monospace;color:#111">62%</span>
              </sc-if>
            </div>
            <sc-if value="{{ t.renaming }}" hint-placeholder-val="{{ false }}">
              <div style="height:18px;border-radius:6px;border:1.5px solid #0A84FF;background:#fff;display:flex;align-items:center;gap:1px;padding:0 5px">
                <span style="font:10px ui-monospace,Menlo,monospace;color:#111">home-v3</span>
                <span style="width:1.5px;height:11px;background:#0A84FF;display:block"></span>
              </div>
            </sc-if>
            <sc-if value="{{ t.static }}" hint-placeholder-val="{{ true }}">
              <div style="{{ t.name }}">{{ t.label }}</div>
            </sc-if>
          </div>
        </sc-for>
        <sc-if value="{{ showAdd }}" hint-placeholder-val="{{ false }}">
          <div style="min-width:0;display:flex;flex-direction:column;gap:8px">
            <div style="height:64px;border-radius:12px;border:1.5px dashed #C9C9C7;display:grid;place-items:center;font:16px/1 ui-monospace,Menlo,monospace;color:#6b6b6b">+</div>
            <div style="font:10px/1 ui-monospace,Menlo,monospace;color:#ABABAB;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">add</div>
          </div>
        </sc-if>
      </div>

      <sc-if value="{{ showPager }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;gap:8px;padding:0 12px 12px">
          <span style="font:11px ui-monospace,Menlo,monospace;color:#6b6b6b">{{ pagerLabel }}</span>
          <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
            <span style="{{ prevStyle }}">‹</span>
            <span style="{{ nextStyle }}">›</span>
          </span>
        </div>
      </sc-if>

      <div style="padding:12px;border-top:1px solid rgba(0,0,0,.08)">
        <div style="display:flex;gap:12px;align-items:flex-start">
          <div style="width:112px;height:112px;flex:none;border-radius:12px;background:#F5F5F5;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center">
            <div style="{{ dot }}"></div>
            <div style="{{ dot }}"></div>
            <div style="{{ dot }}"></div>
            <div style="{{ dot }}"></div>
            <div style="{{ centreCell }}"></div>
            <div style="{{ dot }}"></div>
            <div style="{{ dot }}"></div>
            <div style="{{ dot }}"></div>
            <div style="{{ dot }}"></div>
          </div>
          <div style="flex:1;display:flex;flex-direction:column;gap:8px">
            <div style="{{ xField }}"><span style="{{ fieldKey }}">X</span><span style="{{ xVal }}">{{ xText }}</span></div>
            <div style="{{ yField }}"><span style="{{ fieldKey }}">Y</span><span style="{{ yVal }}">{{ yText }}</span><sc-if value="{{ yFocused }}" hint-placeholder-val="{{ false }}"><span style="width:1.5px;height:15px;background:#0A84FF;display:block"></span></sc-if></div>
            <div style="{{ sField }}"><span style="width:24px;display:flex;align-items:center"><span style="{{ sIcon }}"></span></span><span style="{{ sVal }}">0.50</span></div>
          </div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:12px;padding:12px">
        <div style="{{ track }}">
          <div style="{{ fill }}"></div>
          <div style="{{ knob }}"></div>
        </div>
        <span style="{{ opValStyle }}">{{ opText }}</span>
      </div>
    </sc-if>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:460},&quot;visible&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;locked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;diff&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;anchor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;focus&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:0,&quot;max&quot;:8,&quot;tsType&quot;:&quot;number&quot;},&quot;page&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:2,&quot;tsType&quot;:&quot;number&quot;},&quot;opacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:50,&quot;min&quot;:0,&quot;max&quot;:100,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;normal&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;renaming&quot;,&quot;empty&quot;,&quot;error&quot;,&quot;uploading&quot;,&quot;dragging&quot;,&quot;collapsed&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;hover&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;eye&quot;,&quot;lock&quot;,&quot;diff&quot;,&quot;layer&quot;,&quot;slider&quot;,&quot;prev&quot;,&quot;next&quot;,&quot;settings&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const visible = p.visible ?? true;
    const locked = p.locked ?? false;
    const diff = p.diff ?? false;
    const mode = p.mode ?? "normal";
    const hover = p.hover ?? "none";
    const anchor = p.anchor ?? true;
    const count = p.count ?? 3;
    const page = p.page ?? 1;
    const opacity = p.opacity ?? 50;

    const tile = (bg, on) =>
      "width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:" + bg +
      (on ? ";box-shadow:0 0 0 2px rgba(255,255,255,.28)" : "");
    const railBg = (active, color, hovered) =>
      active ? color : (hovered ? "#2a2a2a" : "#1c1c1c");

    const isEmpty = mode === "empty";
    const isError = mode === "error";
    const isUploading = mode === "uploading";
    const isDragging = mode === "dragging";
    const open = mode !== "collapsed";
    const hasLayers = !isEmpty && !isError;

    const posDis = locked || !visible;
    const opDis = !visible;

    const perPage = 6;
    const showPager = count > perPage;
    const start = (page - 1) * perPage;
    const names = ["cover.png", "home-v3.png", "nav-fix.png", "pricing-b.png", "footer-v2.png", "hero-alt.png", "cta-c.png", "modal.png"];
    const slice = names.slice(start, Math.min(start + perPage, count));

    const thumbTile = (opts) => {
      const sel = opts.sel;
      const base = "position:relative;height:64px;border-radius:12px;background:repeating-linear-gradient(135deg," +
        (sel ? "#c9c9c9 0 4px,#dedede 4px 8px" : "#dcdcdc 0 4px,#eaeaea 4px 8px") + ")";
      let s = base;
      if (sel) s += ";box-shadow:0 0 0 2px #0A84FF";
      if (opts.hovered) s += ";box-shadow:0 0 0 2px " + (sel ? "#0A84FF" : "#ABABAB");
      if (opts.lifted) s += ";box-shadow:0 6px 16px rgba(0,0,0,.24),0 0 0 2px #0A84FF;transform:rotate(-2deg) scale(1.03)";
      if (!visible && sel) s += ";opacity:.45";
      if (opts.drop) s = "height:64px;border-radius:12px;border:1.5px dashed #0A84FF;background:#F2F8FF";
      return s;
    };
    const nameStyle = (sel) =>
      "font:10px/1 ui-monospace,Menlo,monospace;color:" + (sel ? "#111" : "#6b6b6b") +
      ";overflow:hidden;text-overflow:ellipsis;white-space:nowrap";

    const mk = (o) => ({
      label: o.label, name: nameStyle(!!o.sel), tile: thumbTile(o),
      showActions: !!o.showActions, showLock: !!o.showLock, showSpinner: !!o.showSpinner,
      renaming: !!o.renaming, static: !o.renaming
    });
    let thumbs = slice.map((n, i) => {
      const sel = start + i === 0;
      return mk({
        label: n, sel: sel,
        hovered: hover === "layer" && sel, lifted: isDragging && sel,
        showActions: hover === "layer" && sel,
        showLock: locked && sel,
        renaming: mode === "renaming" && start + i === 1
      });
    });
    if (isDragging) {
      thumbs = [thumbs[0], mk({ label: "drop here", drop: true })].concat(thumbs.slice(1));
    }
    if (isUploading) {
      thumbs = thumbs.concat([mk({ label: "menu-b.png", showSpinner: true })]);
    }

    const pageBtn = (enabled, hovered) =>
      "width:28px;height:28px;border-radius:10px;display:grid;place-items:center;font:13px ui-monospace,Menlo,monospace;background:" +
      (enabled ? (hovered ? "#E6E6E5" : "#F5F5F5") : "#FAFAF9") + ";color:" + (enabled ? "#111" : "#C9C9C7");

    const fieldOn = "height:32px;border-radius:12px;background:#fff;border:1px solid #11111118;display:flex;align-items:center;gap:8px;padding:0 12px";
    const fieldOff = "height:32px;border-radius:12px;background:#F5F5F5;border:1px solid transparent;display:flex;align-items:center;gap:8px;padding:0 12px";
    const fieldFocus = "height:32px;border-radius:12px;background:#fff;border:1.5px solid #0A84FF;display:flex;align-items:center;gap:8px;padding:0 11.5px";
    const valOn = "flex:1;font:14px ui-monospace,Menlo,monospace;color:#111";
    const valOff = "flex:1;font:14px ui-monospace,Menlo,monospace;color:#6b6b6b";
    const valDis = "flex:1;font:14px ui-monospace,Menlo,monospace;color:#C9C9C7";

    const editable = !anchor && !posDis;
    const yFocused = editable && (p.focus ?? true);

    const tips = { eye: "Hide overlay  ⌥V", lock: "Lock position  ⌥L", diff: "Difference  ⌥D" };
    const tipTop = { eye: 108, lock: 156, diff: 204 };

    return {
      visible: visible, hidden: !visible, locked: locked, unlocked: !locked,
      diff: diff, noDiff: !diff, open: open, isEmpty: isEmpty, isError: isError, hasLayers: hasLayers,
      eyeTile: tile(railBg(visible, "#0A84FF", hover === "eye"), hover === "eye"),
      lockTile: tile(railBg(locked, "#FF8A00", hover === "lock"), hover === "lock"),
      diffTile: tile(railBg(diff, "#FFC400", hover === "diff"), hover === "diff"),
      showTip: !!tips[hover],
      tip: tips[hover] || "",
      tipStyle: "position:absolute;left:72px;top:" + (tipTop[hover] || 0) + "px;padding:5px 8px;border-radius:8px;background:#111;color:#fff;font:10px/1 ui-monospace,Menlo,monospace;white-space:nowrap;z-index:5",
      gearTile: "width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:" + (hover === "settings" ? "#F0EFEC" : "transparent"),
      infoTile: "width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:transparent",
      thumbs: thumbs,
      showAdd: count > 0 && count < perPage && !isDragging && !isUploading,
      showPager: showPager,
      pagerLabel: page + " / " + Math.ceil(count / perPage),
      prevStyle: pageBtn(page > 1, hover === "prev"),
      nextStyle: pageBtn(page < Math.ceil(count / perPage), hover === "next"),
      dot: "width:4px;height:4px;border-radius:50%;background:" + (posDis ? "#D6D6D4" : "#ABABAB"),
      centreCell: anchor
        ? "width:16px;height:16px;border-radius:4px;background:" + (posDis ? "#B9D8FA" : "#0A84FF")
        : "width:4px;height:4px;border-radius:50%;background:" + (posDis ? "#D6D6D4" : "#ABABAB"),
      xField: editable ? fieldOn : fieldOff,
      yField: yFocused ? fieldFocus : (editable ? fieldOn : fieldOff),
      xVal: posDis ? valDis : (editable ? valOn : valOff),
      yVal: posDis ? valDis : (editable ? valOn : valOff),
      xText: "640", yText: "312",
      fieldKey: "font:12px ui-monospace,Menlo,monospace;color:" + (posDis ? "#C9C9C7" : "#6b6b6b") + ";width:24px",
      yFocused: yFocused,
      sField: posDis ? fieldOff : fieldOn,
      sIcon: "width:13px;height:13px;border:1.5px dashed " + (posDis ? "#C9C9C7" : "#6b6b6b") + ";display:block",
      sVal: posDis ? valDis : valOn,
      track: "position:relative;flex:1;height:32px;border-radius:12px;overflow:hidden;background:" + (opDis ? "#F5F5F5" : "#E6E6E5"),
      fill: "position:absolute;left:0;top:0;bottom:0;width:" + opacity + "%;background:" + (opDis ? "#DCDCDA" : "#0A84FF"),
      knob: "position:absolute;left:clamp(4px, " + opacity + "%, calc(100% - 8px));top:5px;bottom:5px;margin-left:-2px;width:" + (hover === "slider" ? 6 : 4) + "px;border-radius:3px;background:" + (opDis ? "#fff" : "#fff") + (hover === "slider" ? ";box-shadow:0 0 0 4px rgba(10,132,255,.22)" : ""),
      opValStyle: "font:14px ui-monospace,Menlo,monospace;width:40px;text-align:right;color:" + (opDis ? "#C9C9C7" : "#111"),
      opText: opacity + "%"
    };
  }
}
</script>
</body>
</html>
